spring:
  datasource:
    url: jdbc:h2:mem:agent;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
app:
  tools:
    search:
      enabled: false
  mcp:
    enabled: false
  bootstrap:
    admin-username: ""
    admin-password: ""
