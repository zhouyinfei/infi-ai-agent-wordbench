server:
  port: 8126
  error:
    include-message: never
    include-stacktrace: never
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: infi-ai-agent
  profiles:
    default: local
  datasource:
    # 本地隐私配置的备份模板：实际值在 application-local.yml 或环境变量中提供。
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/infi_agent_it?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
  jackson:
    default-property-inclusion: non_null
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
app:
  rag:
    enabled: ${RAG_ENABLED:false}
    minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
    minio-secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${RAG_BUCKET:agent-wordbench-knowledge}
    elasticsearch-url: ${ELASTICSEARCH_URL:https://localhost:9200}
    elasticsearch-api-key: ${ELASTICSEARCH_API_KEY:}
    elasticsearch-username: ${ELASTICSEARCH_USERNAME:}
    elasticsearch-password: ${ELASTICSEARCH_PASSWORD:}
    elasticsearch-ca-certificate: ${ELASTICSEARCH_CA_CERTIFICATE:}
    index: ${RAG_INDEX:agent-knowledge-v1}
    embedding-url: ${EMBEDDING_URL:https://api.openai.com/v1}
    embedding-api-key: ${EMBEDDING_API_KEY:}
    embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${EMBEDDING_DIMENSIONS:1536}
    chunk-size: 800
    chunk-overlap: 120
    max-characters: 200000
    max-searches-per-run: ${RAG_MAX_SEARCHES_PER_RUN:3}
    retrieval:
      min-score: ${RAG_MIN_SCORE:0.4}
      hybrid-enabled: ${RAG_HYBRID_ENABLED:true}
      candidate-size: ${RAG_CANDIDATE_SIZE:30}
      rrf-k: ${RAG_RRF_K:60}
      vector-weight: ${RAG_VECTOR_WEIGHT:0.7}
      keyword-weight: ${RAG_KEYWORD_WEIGHT:0.3}
    timeout: 60s
  mcp:
    enabled: true
    timeout: 30s
    servers:
      # 远程 MCP 配置示例，需要时取消注释并填写实际端点及凭证。
      # - name: knowledge
      #   transport: STREAMABLE_HTTP
      #   url: http://127.0.0.1:3001/mcp
      #   headers:
      #     Authorization: Bearer ${KNOWLEDGE_MCP_TOKEN}
      #   allowed-tools:
      #     - search
      - name: local
        transport: STDIO
        # 复用当前后端的 Java 运行时；首次启动前执行 mvn package 生成服务端 JAR。
        command:
          - ${java.home}/bin/java
          - -jar
          - ${MCP_STDIO_JAR:${user.dir}/target/infi-ai-agent-0.1.0-mcp-stdio.jar}
        allowed-tools:
          - calculator
          - current_time
  tools:
    search:
      enabled: ${TOOL_SEARCH_ENABLED:true}
      api-key: ${TAVILY_API_KEY:}
      max-results: ${TOOL_SEARCH_MAX_RESULTS:5}
    files:
      root: ${TOOL_FILES_ROOT:./tool-workspace}
  auth:
    token-ttl: 8h
    login-window: 15m
    max-login-attempts: 10
  bootstrap:
    # 仅空用户表时可初始化管理员，无默认密码。
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  ai:
    default-model: deepseek-v4-flash-0731
    models:
      "[deepseek-v4.1-flash]":
        enabled: true
        provider: openai-compatible
        base-url: https://ws-pl6el2kmifl7zzb2.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        model-name: deepseek-v4.1-flash
        api-key: ${DEEPSEEK_API_KEY}
        request-timeout: 30s

      deepseek-v4-flash-0731:
        enabled: true
        provider: openai-compatible
        base-url: https://ws-pl6el2kmifl7zzb2.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        model-name: deepseek-v4-flash-0731
        api-key: ${DASHSCOPE_API_KEY}
        request-timeout: 30s
  multi-agent:
    max-iterations: 12
    max-tool-calls: 10
    max-repeated-calls: 2
    max-tasks: 4
    task-timeout: 500s
  chat-memory:
    max-messages: 20
    max-characters: 32000
    cache-ttl: 24h
  react:
    max-iterations: 6
    max-tool-calls: 10
    max-repeated-calls: 2
    task-timeout: 500s
