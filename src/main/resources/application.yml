server:
  port: 8126
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: infi-ai-agent
  profiles:
    default: local
  datasource:
    # 本地隐私配置的备份模板：实际值在 application-local.yml 或环境变量中提供。
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/infi_agent_it?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
  jackson:
    default-property-inclusion: non_null
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
app:
  mcp:
    enabled: true
    timeout: 30s
    servers:
      # 远程 MCP 配置示例，需要时取消注释并填写实际端点及凭证。
      # - name: knowledge
      #   transport: STREAMABLE_HTTP
      #   url: http://127.0.0.1:3001/mcp
      #   headers:
      #     Authorization: Bearer ${KNOWLEDGE_MCP_TOKEN}
      #   allowed-tools:
      #     - search
      - name: local
        transport: STDIO
        # 复用当前后端的 Java 运行时；首次启动前执行 mvn package 生成服务端 JAR。
        command:
          - ${java.home}/bin/java
          - -jar
          - ${MCP_STDIO_JAR:${user.dir}/target/infi-ai-agent-0.1.0-mcp-stdio.jar}
        allowed-tools:
          - calculator
          - current_time
  tools:
    search:
      enabled: ${TOOL_SEARCH_ENABLED:true}
      api-key: ${TAVILY_API_KEY:}
      max-results: ${TOOL_SEARCH_MAX_RESULTS:5}
    files:
      root: ${TOOL_FILES_ROOT:./tool-workspace}
  auth:
    token-ttl: 8h
    login-window: 15m
    max-login-attempts: 10
  bootstrap:
    # 仅空用户表时可初始化管理员，无默认密码。
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model-name: ${AI_MODEL:}
    # 隐私配置备份占位，实际密钥填入 application-local.yml 或环境变量。
    api-key: ${AI_API_KEY:}
    request-timeout: 500s
  multi-agent:
    max-iterations: 12
    max-tool-calls: 10
    max-repeated-calls: 2
    max-tasks: 4
    task-timeout: 500s
  chat-memory:
    max-messages: 20
    max-characters: 32000
    cache-ttl: 24h
  react:
    max-iterations: 6
    max-tool-calls: 10
    max-repeated-calls: 2
    task-timeout: 500s
